cameras:
- name: overhead
  pose:
  - 0
  - 0
  - 1.3
  - 1
  - 0
  - 0
  - 0
  fov_deg: 60
  width: 640
  height: 480
  rate_hz: 10
robot:
  model: unitree_g1
  base_mode: base_fixed
  usd: _external/isaac_assets/G1/g1.usd
  prim_path: /World/Robot
  variants:
    Physics: SimplifiedPhysX
    Sensor: None
    left_hand: None
    right_hand: None
  pose:
  - 0.0
  - -0.55
  - 0.77
  - 1
  - 0
  - 0
  - 0
  visible: false
  end_effector:
    type: parallel_jaw
    max_width_m: 0.08
physics:
  dt: 0.008333333333333333
  substeps: 2
  solver: TGS
  contact_report:
    enabled: true
    max_contacts_per_pair: 8
  determinism:
    fixed_gpu: true
    seed: 0
task:
  id: track_objects_s1
  initial_facts: []
  goal_facts: []
  time_limit_s: 10
faults:
- at_step: 180
  kind: occlusion_insert
  params:
    occluder: fault_board_01
    region:
    - 0.0
    - 0.0
    size:
    - 0.3
    - 0.3
    - 0.01
    duration_steps: 120
perception:
  mode: offline
  detector_tier: oracle
  noise_profile: null
relations_gt:
  predicates:
  - left_of
  - right_of
  - in_front_of
  - behind
  - on_top_of
  - inside
  - touching
  - near
  - above
  - below
  compute_from: gt_poses
  tolerance_m: 0.02
metrics:
  primary:
  - idf1
  - id_retention
  - id_switches
  - duplicate_rate
  - reappearance_rate
  leading:
  - slot_purity
  - provenance_completeness
  guardrail:
  - safety_violation_rate
  - permission_violation_count
recording:
  obs_rate_hz: 10
  gt_rate_hz: 120
  bundle_format: parquet
  store_images: false

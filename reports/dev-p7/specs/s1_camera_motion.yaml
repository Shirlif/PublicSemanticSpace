      - 0.0
      - 0.9
    - t_s: 10.0
      pos:
      - 0.6
      - 0.0
      - 0.9
cameras:
- name: overhead
  pose:
  - 0.0
  - 0.0
  - 1.3
  - 1
  - 0
  - 0
  - 0
  fov_deg: 60
  width: 640
  height: 480
  rate_hz: 10
  motion:
  - t_s: 0.0
    pos:
    - 0.0
    - 0.0
    - 1.3
  - t_s: 5.0
    pos:
    - 0.25
    - -0.2
    - 1.1
  - t_s: 10.0
    pos:
    - 0.0
    - 0.0
    - 1.3
physics:
  dt: 0.008333333333333333
  substeps: 2
  solver: TGS
  contact_report:
    enabled: true
    max_contacts_per_pair: 8
  determinism:
    fixed_gpu: true
    seed: 0
task:
  id: track_objects
  initial_facts: []
  goal_facts: []
  time_limit_s: 10
faults: []
perception:
  mode: offline
  detector_tier: oracle
  noise_profile: null
relations_gt:
  predicates:
  - left_of
  - right_of
  - in_front_of
  - behind
  - on_top_of
  - inside
  - touching
  - near
  - above
  - below
  compute_from: gt_poses
  tolerance_m: 0.02
metrics:
  primary:
  - idf1
  - id_retention
  - id_switches
  - duplicate_rate
  - reappearance_rate
  leading:
  - slot_purity
  - provenance_completeness
  guardrail:
  - safety_violation_rate
  - permission_violation_count
recording:
  obs_rate_hz: 10
  gt_rate_hz: 120
  bundle_format: parquet
  store_images: false

scene:
  table:
    size:
    - 1.2
    - 0.8
    - 0.04
    height_m: 0.75
    friction: 0.7
  workspace:
    xy:
    - - -0.3
      - -0.25
    - - 0.3
      - 0.25
    table_z: 0.77
  lighting:
    preset: studio
  occluders:
  - name: occluder_board_01
    size:
    - 0.12
    - 0.5
    - 0.01
    pose:
    - -0.6
    - 0.0
    - 0.9
    - 1
    - 0
    - 0
    - 0

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: egl
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system GL deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa libgl1-mesa-dri
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[sim]"
          pip install pytest
      - name: Tests
        run: python -m pytest
      - name: Binding benchmark (quick)
        run: python bench/binding_stability.py --quick
      - name: Phase 1 binding comparison (quick)
        run: python bench/phase1_binding.py --quick
      - name: Sim pipeline smoke test
        run: python -m pss.sim.scripts.generate_dataset --out /tmp/pss_data --scale tiny --width 64 --height 64 --seed 0

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pss"
version = "0.1.0"
description = "Public Semantic Space — Phase 0 skeleton"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6"]

[project.scripts]
pss = "pss.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6"]
eval = ["pandas>=2", "pyarrow>=14"]
sim = ["mujoco>=3.2", "pillow>=10"]
train = ["torch>=2.2", "scikit-learn>=1.3", "scipy>=1.10", "pyyaml>=6"]
backbone = ["torchvision>=0.20"]

[tool.setuptools.packages.find]
include = ["pss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

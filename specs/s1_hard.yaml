- name: overhead
  pose:
  - 0
  - 0
  - 1.35
  - 1
  - 0
  - 0
  - 0
  fov_deg: 65
  width: 640
  height: 480
  rate_hz: 10
  motion:
  - t_s: 0.0
    pos:
    - 0.0
    - 0.0
    - 1.35
  - t_s: 5.0
    pos:
    - 0.3
    - -0.3
    - 1.25
  - t_s: 10.0
    pos:
    - 0.0
    - 0.0
    - 1.35
physics:
  dt: 0.008333333333333333
  substeps: 2
  solver: TGS
  contact_report:
    enabled: true
    max_contacts_per_pair: 8
  determinism:
    fixed_gpu: true
    seed: 0
task:
  id: track_hard
  initial_facts: []
  goal_facts: []
  time_limit_s: 10
faults:
- at_step: 300
  kind: object_relocate
  params:
    target: cube_00
    pose:
    - 0.24
    - -0.15
    - 0.79
- at_step: 700
  kind: object_relocate
  params:
    target: cube_05
    pose:
    - -0.24
    - 0.18
    - 0.79
perception:
  mode: offline
  detector_tier: oracle
  noise_profile: null
relations_gt:
  predicates:
  - left_of
  - right_of
  - in_front_of
  - behind
  - on_top_of
  - inside
  - touching
  - near
  - above
  - below
  compute_from: gt_poses
  tolerance_m: 0.02
metrics:
  primary:
  - idf1
  - id_retention
  - reappearance_rate
  - duplicate_rate
  leading: []
  guardrail: []
recording:
  obs_rate_hz: 10
  gt_rate_hz: 120
  bundle_format: parquet
  store_images: false

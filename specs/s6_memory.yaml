spec_version: 1
id: s6_memory_v1
task_family: tracking
split: test
notes:
- 'S6: 5 sub-episodes in one continuous session; objects are physically relocated
  between episodes.'
- No robot and no camera motion; memory is tested across episodes, not viewpoints.
seed_policy:
  episode_seeds:
  - 0
  pose_sampling: fixed
assets:
  instances:
  - id: cup_a
    class: cup
    usd: builtin://cube
    size_m:
    - 0.04
    - 0.04
    - 0.04
    mass_kg: 0.05
    friction:
      static: 0.8
      dynamic: 0.6
    restitution: 0.05
    pose:
    - -0.18
    - -0.1
    - 0.79
    - 1
    - 0
    - 0
    - 0
    color:
    - 0.8
    - 0.1
    - 0.1
    split: test
  - id: cup_b
    class: cup
    usd: builtin://cube
    size_m:
    - 0.04
    - 0.04
    - 0.04
    mass_kg: 0.05
    friction:
      static: 0.8
      dynamic: 0.6
    restitution: 0.05
    pose:
    - 0.0
    - -0.05
    - 0.79
    - 1
    - 0
    - 0
    - 0
    color:
    - 0.1
    - 0.7
    - 0.15
    split: test
  - id: cup_c
    class: cup
    usd: builtin://cube
    size_m:
    - 0.04
    - 0.04
    - 0.04
    mass_kg: 0.05
    friction:
      static: 0.8
      dynamic: 0.6
    restitution: 0.05
    pose:
    - 0.18
    - 0.0
    - 0.79
    - 1
    - 0
    - 0
    - 0
    color:
    - 0.1
    - 0.25
    - 0.8
    split: test
scene:
  table:
    size:
    - 1.2
    - 0.8
    - 0.04
    height_m: 0.75
    friction: 0.7
  workspace:
    xy:
    - - -0.3
      - -0.25
    - - 0.3
      - 0.25
    table_z: 0.77
cameras:
- name: overhead
  pose:
  - 0
  - 0
  - 1.3
  - 1
  - 0
  - 0
  - 0
  fov_deg: 60
  width: 640
  height: 480
  rate_hz: 10
physics:
  dt: 0.008333333333333333
  substeps: 2
  solver: TGS
  contact_report:
    enabled: true
    max_contacts_per_pair: 8
  determinism:
    fixed_gpu: true
    seed: 0
task:
  id: memory_session
  initial_facts: []
  goal_facts: []
  time_limit_s: 3
  session:
    sub_episodes: 5
    sub_episode_s: 3
    relocations:
    - after: 0
      target: cup_a
      pose:
      - 0.18
      - 0.15
      - 0.79
      - 1
      - 0
      - 0
      - 0
    - after: 1
      target: cup_b
      pose:
      - -0.18
      - 0.15
      - 0.79
      - 1
      - 0
      - 0
      - 0
    - after: 2
      target: cup_c
      pose:
      - 0.0
      - 0.15
      - 0.79
      - 1
      - 0
      - 0
      - 0
    - after: 3
      target: cup_a
      pose:
      - -0.18
      - -0.15
      - 0.79
      - 1
      - 0
      - 0
      - 0
faults: []
perception:
  mode: offline
  detector_tier: oracle
  noise_profile: null
relations_gt:
  predicates:
  - left_of
  - right_of
  - in_front_of
  - behind
  - on_top_of
  - inside
  - touching
  - near
  - above
  - below
  compute_from: gt_poses
  tolerance_m: 0.02
metrics:
  primary:
  - edited_accuracy
  - rollback_exactness
  - id_retention
  leading: []
  guardrail: []
recording:
  obs_rate_hz: 10
  gt_rate_hz: 120
  bundle_format: parquet
  store_images: false
